services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helioaudit-api
    ports:
      - "${HOST_PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      # In-container listen port (do not reuse host PORT from .env for publish mapping)
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
